name: Build and publish personal site

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '27 21 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: site/requirements.txt
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install image tools
        run: python -m pip install -r site/requirements.txt
      - name: Test local studio and publishing boundaries
        run: python -X utf8 -m unittest discover -s site/tests -p 'test_*.py'
      - name: Test adaptive rotation
        run: node --test site/tests/rotation-engine.test.cjs site/tests/gallery-browser.test.cjs

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: site/requirements.txt
      - name: Install image tools
        run: python -m pip install -r site/requirements.txt
      - name: Refresh public GitHub projects
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python site/sync_projects.py
      - name: Build static website
        run: python site/publish.py package
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
